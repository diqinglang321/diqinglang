<script>
const DATA=JSON.parse(document.getElementById('deck-data').textContent);
const scene=document.getElementById('scene'),stage=document.getElementById('stage');
const slider=document.getElementById('progress'),counter=document.getElementById('counter'),notes=document.getElementById('notes');
let current=-1,nodes=new Map(),timers=[],epoch=0;
const ease='cubic-bezier(.22,.75,.18,1)';
function build(unit){let el=document.createElement('div');el.className='unit';el.dataset.key=unit.id;let [x,y,w,h]=unit.b;Object.assign(el.style,{left:x/12.8+'%',top:y/7.2+'%',width:w/12.8+'%',height:h/7.2+'%'});el.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${unit.b.join(' ')}" font-family="Arial" preserveAspectRatio="none">${DATA.defs}${unit.xml}</svg>`;return el}
function animate(el,frames,opts={}){return el.animate(frames,{duration:700,easing:ease,fill:'both',...opts})}
function finish(){for(const id of timers)clearTimeout(id);timers=[];for(const a of scene.getAnimations({subtree:true}))a.finish();for(const el of scene.querySelectorAll('[data-old]'))el.remove()}
function matrix(from,to){let [x,y,w,h]=from,[xx,yy,ww,hh]=to;return {transform:`translate(${(x-xx)/ww*100}%,${(y-yy)/hh*100}%) scale(${w/ww},${h/hh})`}}
async function go(index,instant=false){index=Math.max(0,Math.min(DATA.slides.length-1,index));if(index===current)return;finish();let token=++epoch;const oldIndex=current,oldNodes=nodes,prev=DATA.slides[current],next=DATA.slides[index];current=index;nodes=new Map();let forward=index===oldIndex+1,reverse=index===oldIndex-1;const match=forward?next.pairs:(reverse?prev.pairs:null);const common=new Set(match||[]);const speed=Number(document.getElementById('pace').value);const duration=instant?0:(common.size?(forward?next.duration:prev.duration):.55)*1000*speed;const oldUnits=new Map((prev?.units||[]).map(u=>[u.id,u]));
for(const [id,el] of oldNodes){el.dataset.old='1';const target=next.units.find(u=>u.id===id);if(common.has(id)&&target){const from=oldUnits.get(id).b,to=target.b;const inv=matrix(to,from);animate(el,[{transform:'none',opacity:1},{...inv,opacity:0}],{duration});}else animate(el,[{opacity:1},{opacity:0}],{duration:Math.min(duration,450*speed)});}
for(const unit of next.units){const el=build(unit);scene.appendChild(el);nodes.set(unit.id,el);let old=oldUnits.get(unit.id);const isPaired=common.has(unit.id)&&old;const effect=next.effects[unit.id];if(isPaired){animate(el,[{...matrix(old.b,unit.b),opacity:0},{transform:'none',opacity:1}],{duration});}else if(!instant&&effect&&forward){let d=duration+effect.delay*1000*speed;let ms=effect.duration*1000*speed;let frames=effect.effect==='entrance_wipe'?[{clipPath:'inset(0 100% 0 0)',opacity:1},{clipPath:'inset(0 0% 0 0)',opacity:1}]:effect.effect==='entrance_faded_zoom'?[{transform:'translate(8%,8%) scale(.84)',opacity:0},{transform:'none',opacity:1}]:[{opacity:0},{opacity:1}];animate(el,frames,{duration:ms,delay:d});}else{animate(el,[{opacity:0},{opacity:1}],{duration});}}
timers.push(setTimeout(()=>{if(token===epoch)for(const el of scene.querySelectorAll('[data-old]'))el.remove()},duration+40));slider.value=index;counter.textContent=`${String(index+1).padStart(2,'0')} / ${DATA.slides.length}`;notes.textContent=next.script;stage.setAttribute('aria-label',`Scene ${index+1}: ${next.title}. Click for next scene.`);document.title=`${index+1}. ${next.title} · Keynote Edition`;window.currentSlide=index;await new Promise(r=>setTimeout(r,duration));}
document.getElementById('next').onclick=()=>go(current+1);document.getElementById('prev').onclick=()=>go(current-1);slider.oninput=e=>go(+e.target.value);stage.onclick=()=>go(current+1);
document.getElementById('script').onclick=()=>{notes.hidden=!notes.hidden;document.getElementById('script').setAttribute('aria-expanded',String(!notes.hidden))};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(DATA.slides.length-1)}if(e.key==='Escape'){notes.hidden=true;document.getElementById('script').setAttribute('aria-expanded','false')}});
window.goTo=go;window.deckData=DATA;go(0,false);
</script></body></html>
